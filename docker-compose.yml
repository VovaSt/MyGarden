services:
  postgres:
    image: postgres:16-alpine
    container_name: mygarden-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mygarden
      POSTGRES_USER: mygarden
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mygarden -d mygarden"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
